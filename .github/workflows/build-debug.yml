name: Build debug APK
on:
  push:
    branches:
      - 'test'
  workflow_dispatch:
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Throne-debug-${{ github.sha }}
          path: app/build/outputs/apk/oss/debug/
          if-no-files-found: error
          retention-days: 14